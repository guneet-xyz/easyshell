name: push problem (csv-to-json)
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/autogenerated-push-csv-to-json.yml"
      - "packages/data/problems/_data/csv-to-json/**"
      - "packages/env/**"
      - "packages/utils/**"
      - "packages/submission-manager/**"

concurrency:
  group: push-csv-to-json
  cancel-in-progress: false

jobs:
  push:
    environment: registry-push
    runs-on: ubuntu-latest
    steps:
      - name: tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - name: docker login
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - uses: actions/checkout@v4
      - run: corepack enable
        name: Enable corepack
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsx scripts/problems/build.ts csv-to-json
        name: build problem
      - run: pnpm tsx scripts/problems/test.ts csv-to-json
        name: test problem
      - run: pnpm tsx scripts/problems/push.ts csv-to-json
        name: push problem
        env:
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
