name: test problem (cat-out-loud)

on:
  pull_request:
    paths:
      - ".github/workflows/autogenerated-test-cat-out-loud.yml"
      - "packages/data/problems/_data/cat-out-loud/**"
      - "packages/env/**"
      - "packages/utils/**"
      - "packages/submission-manager/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: corepack enable
        name: Enable corepack
      - run: pnpm install --frozen-lockfile
        name: Install dependencies
      - run: pnpm tsx scripts/problems/build.ts cat-out-loud
      - run: pnpm tsx scripts/problems/test.ts cat-out-loud
