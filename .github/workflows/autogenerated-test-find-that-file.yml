name: test problem (find-that-file)

on:
  pull_request:
    paths:
      - ".github/workflows/autogenerated-test-find-that-file.yml"
      - "packages/data/problems/_data/find-that-file/**"
      - "packages/env/**"
      - "packages/utils/**"
      - "packages/submission-manager/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: corepack enable
        name: Enable corepack
      - run: pnpm install --frozen-lockfile
        name: Install dependencies
      - run: pnpm tsx scripts/problems/build.ts find-that-file
      - run: pnpm tsx scripts/problems/test.ts find-that-file
