name: test problem (get-it-curl)

on:
  pull_request:
    paths:
      - ".github/workflows/autogenerated-test-get-it-curl.yml"
      - "packages/data/problems/_data/get-it-curl/**"
      - "packages/env/**"
      - "packages/utils/**"
      - "packages/submission-manager/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: corepack enable
        name: Enable corepack
      - run: pnpm install --frozen-lockfile
        name: Install dependencies
      - run: pnpm tsx scripts/problems/build.ts get-it-curl
      - run: pnpm tsx scripts/problems/test.ts get-it-curl
