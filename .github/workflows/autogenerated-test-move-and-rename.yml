name: test problem (move-and-rename)

on:
  pull_request:
    paths:
      - ".github/workflows/autogenerated-test-move-and-rename.yml"
      - "packages/data/problems/_data/move-and-rename/**"
      - "packages/env/**"
      - "packages/utils/**"
      - "packages/submission-manager/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: corepack enable
        name: Enable corepack
      - run: pnpm install --frozen-lockfile
        name: Install dependencies
      - run: pnpm tsx scripts/problems/build.ts move-and-rename
      - run: pnpm tsx scripts/problems/test.ts move-and-rename
