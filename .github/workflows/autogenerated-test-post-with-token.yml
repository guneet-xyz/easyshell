name: test problem (post-with-token)

on:
  pull_request:
    paths:
      - ".github/workflows/autogenerated-test-post-with-token.yml"
      - "packages/data/problems/_data/post-with-token/**"
      - "packages/env/**"
      - "packages/utils/**"
      - "packages/submission-manager/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
      - run: corepack enable
        name: Enable corepack
      - run: pnpm install --frozen-lockfile
        name: Install dependencies
      - run: pnpm tsx scripts/problems/build.ts post-with-token
      - run: pnpm tsx scripts/problems/test.ts post-with-token
