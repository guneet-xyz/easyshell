networks:
  easyshell:
    external: true
services:
  submission-manager:
    build:
      context: .
      dockerfile: Dockerfile
      target: submission-manager
    container_name: easyshell-dev-submission-manager
    volumes:
      - /tmp/easyshell:/tmp/easyshell
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - easyshell
    environment:
      APP: submission-manager
      DATABASE_URL: postgres://easyshell:password@db/easyshell
    depends_on:
      - db
  session-manager:
    build:
      context: .
      dockerfile: Dockerfile
      target: session-manager
    container_name: easyshell-dev-session-manager
    environment:
      TOKEN: token
    networks:
      - easyshell
    ports:
      - 4000:4000
    volumes:
      - /tmp/easyshell:/tmp/easyshell
      - /var/run/docker.sock:/var/run/docker.sock
  db:
    container_name: easyshell-dev-db
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_USER: easyshell
      POSTGRES_DB: easyshell
    volumes:
      - ./data/postgres:/var/lib/postgresql
    restart: always
    ports:
      - 5432:5432
    networks:
      - easyshell
  website:
    build:
      context: .
      dockerfile: Dockerfile
      target: website
      args:
        POSTHOG_KEY: ${POSTHOG_KEY}
        POSTHOG_HOST: ${POSTHOG_HOST}
    container_name: easyshell-dev-website
    environment:
      APP: website
      AUTH_TRUST_HOST: true
      DATABASE_URL: postgres://easyshell:password@db/easyshell
      NEXTAUTH_SECRET: secret
      NEXTAUTH_URL: http://localhost:3000
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SESSION_MANAGER_URL: http://session-manager:4000
      SESSION_MANAGER_TOKEN: token
      RESEND_API_KEY: ${RESEND_API_KEY}
    networks:
      - easyshell
    ports:
      - 3000:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 1s
      timeout: 500ms
      retries: 3
    depends_on:
      - db
